name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    name: Swift ${{ matrix.swift }} on Ubuntu
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        swift: ["6.0"]

    steps:
      - uses: actions/checkout@v4

      - uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ matrix.swift }}

      - name: Build
        run: swift build -v

      - name: Test
        run: swift test

      - name: Validate pixel sprites
        run: .build/debug/harvesthollow validate

      - name: Smoke-test the gameplay demo
        run: .build/debug/harvesthollow demo
