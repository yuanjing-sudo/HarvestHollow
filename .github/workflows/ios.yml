name: iOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build and launch the iOS app
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: Apps/HarvestHollow
        run: xcodegen generate

      - name: Build for the simulator
        working-directory: Apps/HarvestHollow
        run: |
          xcodebuild \
            -project HarvestHollow.xcodeproj \
            -scheme HarvestHollow \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Boot a simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { print $2; exit }')
          if [ -z "$UDID" ]; then
            echo "No available iPhone simulator" >&2
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b

      - name: Launch the game and capture screenshots
        run: |
          UDID="${{ steps.sim.outputs.udid }}"
          xcrun simctl install "$UDID" \
            Apps/HarvestHollow/build/Build/Products/Debug-iphonesimulator/HarvestHollow.app
          for tab in farm barn market house quests town arcade economy world; do
            xcrun simctl terminate "$UDID" com.harvesthollow.game || true
            SIMCTL_CHILD_HARVEST_HOLLOW_SKIP_WELCOME=1 \
            SIMCTL_CHILD_HARVEST_HOLLOW_START_TIME=0.42 \
            SIMCTL_CHILD_HARVEST_HOLLOW_START_TAB="$tab" \
              xcrun simctl launch "$UDID" com.harvesthollow.game
            sleep 7
            xcrun simctl io "$UDID" screenshot "docs/screenshot-$tab.png"
          done

          for route in fishing kitchen achievements almanac collection help; do
            xcrun simctl terminate "$UDID" com.harvesthollow.game || true
            SIMCTL_CHILD_HARVEST_HOLLOW_SKIP_WELCOME=1 \
            SIMCTL_CHILD_HARVEST_HOLLOW_START_TIME=0.42 \
            SIMCTL_CHILD_HARVEST_HOLLOW_START_TAB=town \
            SIMCTL_CHILD_HARVEST_HOLLOW_START_TOWN_ROUTE="$route" \
              xcrun simctl launch "$UDID" com.harvesthollow.game
            sleep 7
            xcrun simctl io "$UDID" screenshot "docs/screenshot-$route.png"
          done

          xcrun simctl spawn "$UDID" log show --last 10m --style compact \
            --predicate 'process == "HarvestHollow" OR composedMessage CONTAINS "HarvestHollow"' \
            > docs/harvesthollow-simulator.log 2>&1 || true

      - name: Upload the screenshots
        uses: actions/upload-artifact@v4
        with:
          name: harvest-hollow-screenshots
          path: |
            docs/screenshot-*.png
            docs/harvesthollow-simulator.log
