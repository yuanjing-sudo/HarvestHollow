name: iOS build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build the iOS app
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate the Xcode project
        working-directory: Apps/HarvestHollow
        run: xcodegen generate

      - name: Build for the simulator
        working-directory: Apps/HarvestHollow
        run: |
          xcodebuild \
            -project HarvestHollow.xcodeproj \
            -scheme HarvestHollow \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
